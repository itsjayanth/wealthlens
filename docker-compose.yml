services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: wealthlens
      POSTGRES_PASSWORD: wealthlens
      POSTGRES_DB: wealthlens
    ports:
      - "5432:5432"
    volumes:
      - wealthlens_db_data:/var/lib/postgresql/data

volumes:
  wealthlens_db_data:
